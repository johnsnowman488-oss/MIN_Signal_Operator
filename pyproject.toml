[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "min-signal-operator"
version = "0.1.0"
description = "Research implementation of the Memory-Integrated Network signal operator"
readme = "README.md"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7", "scipy>=1.10"]
notebook = ["jupyter>=1", "matplotlib>=3.7", "scipy>=1.10"]
research = ["scipy>=1.10"]

[tool.setuptools.packages.find]
include = ["min*"]
