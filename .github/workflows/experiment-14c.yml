name: Experiment 14C

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "experiments/14C_geometry_to_task.py"
      - "tests/test_experiment_14c.py"
      - ".github/workflows/experiment-14c.yml"
      - "min/**"
      - "pyproject.toml"
  push:
    paths:
      - "experiments/14C_geometry_to_task.py"
      - "tests/test_experiment_14c.py"
      - ".github/workflows/experiment-14c.yml"
      - "min/**"
      - "pyproject.toml"

jobs:
  run-14c:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: pip install -e ".[research,test]"
      - name: Run targeted 14C tests
        run: pytest -q tests/test_experiment_14c.py tests/test_soe_memory_state.py
      - name: Run Experiment 14C
        run: python experiments/14C_geometry_to_task.py
      - name: Upload 14C results
        uses: actions/upload-artifact@v4
        with:
          name: experiment-14c-results
          path: experiments/results/14C_geometry_to_task_*
