name: Experiment 15F-C

on:
  push:
    paths:
      - "experiments/15F_C_communications_budget_scaling.py"
      - "experiments/15E_state_budget_sweep.py"
      - "experiments/15C_extended_timescale_iir_control.py"
      - "experiments/15_utils.py"
      - "tests/test_experiment_15fc.py"
      - ".github/workflows/experiment-15f-c.yml"
      - "min/**"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  run-15f-c:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[research,test]"
      - run: pytest -q tests/test_experiment_15fc.py tests/test_soe_memory_state.py
      - run: python experiments/15F_C_communications_budget_scaling.py
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-15f-c-results
          path: |
            experiments/results/15F_C_communications_budget_scaling_cases.csv
            experiments/results/15F_C_communications_budget_scaling_summary.csv
            experiments/results/15F_C_communications_budget_scaling_paired_deltas.csv
            experiments/results/15F_C_communications_budget_scaling_budget_deltas.csv
            experiments/results/15F_C_communications_budget_scaling_summary.json
