name: Experiment 15C
on:
  push:
    paths:
      - "experiments/15_utils.py"
      - "experiments/15C_extended_timescale_iir_control.py"
      - "tests/test_experiment_15c.py"
      - ".github/workflows/experiment-15c.yml"
      - "min/**"
      - "pyproject.toml"
  workflow_dispatch:
jobs:
  run-15c:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[research,test]"
      - run: pytest -q tests/test_experiment_15c.py tests/test_soe_memory_state.py
      - run: python experiments/15C_extended_timescale_iir_control.py
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-15c-results
          path: |
            experiments/results/15C_extended_timescale_iir_control_cases.csv
            experiments/results/15C_extended_timescale_iir_control_pca_results.csv
            experiments/results/15C_extended_timescale_iir_control_summary.csv
            experiments/results/15C_extended_timescale_iir_control_summary.json
