name: experiment-13b

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/13B_geometry_to_state_structure.py"
      - ".github/workflows/experiment-13b.yml"
      - "docs/experiments/13B_Geometry_State_Structure.md"

jobs:
  run-13b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test,research]"
      - name: Run tests
        run: python -m pytest -q
      - name: Run Experiment 13B
        run: python experiments/13B_geometry_to_state_structure.py
      - name: Upload 13B results
        uses: actions/upload-artifact@v4
        with:
          name: experiment-13b-results
          path: |
            experiments/results/13B_geometry_to_state_structure_results.csv
            experiments/results/13B_geometry_to_state_structure_summary.csv
            experiments/results/13B_geometry_to_state_structure_summary.json
