name: experiment-13c

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/13C-1_environment_to_kernel_geometry.py"
      - "experiments/13C-2_finite_observation_kernel_uncertainty.py"
      - "docs/experiments/13C-2_Finite_Observation_Kernel_Uncertainty.md"
      - ".github/workflows/experiment-13c.yml"
      - "docs/experiments/13C_Environment_Kernel_Geometry.md"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: pip install -e ".[test,research]"
      - name: Run tests
        run: pytest -q
      - name: Run Experiment 13C-1
        run: python experiments/13C-1_environment_to_kernel_geometry.py
      - name: Run Experiment 13C-2
        run: python experiments/13C-2_finite_observation_kernel_uncertainty.py
      - name: Upload 13C-1 results
        uses: actions/upload-artifact@v4
        with:
          name: experiment-13c-1-results
          path: |
            experiments/results/13C-1_environment_to_kernel_geometry_results.csv
            experiments/results/13C-1_environment_to_kernel_geometry_summary.csv
            experiments/results/13C-1_environment_to_kernel_geometry_summary.json
      - name: Upload 13C-2 results
        uses: actions/upload-artifact@v4
        with:
          name: experiment-13c-2-results
          path: |
            experiments/results/13C-2_finite_observation_kernel_uncertainty_results.csv
            experiments/results/13C-2_finite_observation_kernel_uncertainty_summary.csv
            experiments/results/13C-2_finite_observation_kernel_uncertainty_summary.json
