name: Experiment 14F

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "experiments/14F_hidden_memory_markovization.py"
      - "tests/test_experiment_14f.py"
      - ".github/workflows/experiment-14f.yml"
      - "experiments/14C_geometry_to_task.py"
      - "min/**"
      - "pyproject.toml"
  push:
    paths:
      - "experiments/14F_hidden_memory_markovization.py"
      - "tests/test_experiment_14f.py"
      - ".github/workflows/experiment-14f.yml"
      - "experiments/14C_geometry_to_task.py"
      - "min/**"
      - "pyproject.toml"

jobs:
  run-14f:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: pip install -e ".[research,test]"
      - name: Run targeted 14F and regression tests
        run: pytest -q tests/test_experiment_14f.py tests/test_experiment_14e.py tests/test_experiment_14c.py tests/test_soe_memory_state.py
      - name: Run Experiment 14F
        run: python experiments/14F_hidden_memory_markovization.py
      - name: Upload 14F results
        uses: actions/upload-artifact@v4
        with:
          name: experiment-14f-results
          path: experiments/results/14F_hidden_memory_markovization_*
