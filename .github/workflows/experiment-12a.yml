name: experiment-12a

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  run-12a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test,notebook]"
      - name: Run Experiment 12A
        run: python experiments/12_receiver_recoverability.py
      - name: Analyze Experiment 12A
        run: python experiments/12A_receiver_recoverability_analysis.py
      - name: Upload 12A results
        uses: actions/upload-artifact@v4
        with:
          name: experiment-12a-results
          path: experiments/results/12*
